name: Verify Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published preview tag to verify (leave blank to check runner availability)
        required: false
        type: string
        default: ''
      backend_only:
        description: Skip Electron smoke and verify only the installed backend/database (not app acceptance)
        required: false
        type: boolean
        default: false
      installer_sha256:
        description: Optional exact candidate SHA256 to prevent testing a replaced release asset
        required: false
        type: string
        default: ''
      pg_probe_only:
        description: Diagnostic only; execute the fixed PostgreSQL probe ZIP without installing or verifying the app
        required: false
        type: boolean
        default: false
      pg_probe_sha256:
        description: Exact SHA256 required for the fixed PostgreSQL probe ZIP
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Confirm standard public Windows runner
        shell: pwsh
        run: |
          Write-Output "Windows runner is available for installer acceptance."
          python --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.release_tag != ''
        with:
          persist-credentials: false
      - name: Verify published installer
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          KERIX_RELEASE_TAG: ${{ inputs.release_tag }}
          KERIX_SKIP_APP_SMOKE: ${{ inputs.backend_only && '1' || '0' }}
          KERIX_EXPECTED_INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          KERIX_PG_PROBE_ONLY: ${{ inputs.pg_probe_only && '1' || '0' }}
          KERIX_PG_PROBE_SHA256: ${{ inputs.pg_probe_sha256 }}
        run: python scripts/verify_windows_installer.py
      - name: Verify acceptance phase isolation and diagnostic redaction
        if: inputs.release_tag != ''
        shell: pwsh
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
